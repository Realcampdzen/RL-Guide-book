name: CI - Code Quality

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run self-check
      run: npm run self-check

    - name: Check prompts vs constants
      run: npm run check:prompts-constants
      
    - name: Type check
      run: npx tsc --noEmit
      
    - name: Build check
      run: npm run build
      
    - name: Check build output
      run: |
        if [ ! -d "dist" ]; then
          echo "Build failed - dist directory not found"
          exit 1
        fi
        echo "Build successful - dist directory created"

  backend-health:
    name: Backend health check
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install npm dependencies
      run: npm ci

    - name: Install Python dependencies
      run: pip install -r backend/requirements.txt

    - name: Start backend, wait for health, run self-check
      run: |
        python backend/app.py &
        for i in $(seq 1 30); do
          if curl -s -o /dev/null -w "%{http_code}" http://localhost:4000/api/health | grep -q 200; then
            echo "Backend is up"
            break
          fi
          sleep 1
        done
        if ! curl -s -o /dev/null -w "%{http_code}" http://localhost:4000/api/health | grep -q 200; then
          echo "Backend did not become ready in time"
          exit 1
        fi
        BACKEND_URL=http://localhost:4000 npm run self-check
